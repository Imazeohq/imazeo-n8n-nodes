# Publishes @imazeo/n8n-nodes-imazeo to npm with provenance (required for n8n verification).
#
# Pattern matches other Imazeo SDK publish workflows:
# - tag push (v*) and optional workflow_dispatch
#
# Flow:
# 1. Locally: npm run release  → bumps version, commits, tags vX.Y.Z, pushes
# 2. This workflow: lint + build + npm publish --provenance
#
# One-time auth (pick one):
# A) npm Trusted Publisher (OIDC, preferred — no long-lived secret):
#    npmjs.com → Access → Trusted Publishers → GitHub Actions
#      Repository owner: Imazeohq
#      Repository name:  imazeo-n8n-nodes
#      Workflow filename: publish.yml
# B) Fallback: repo secret NPM_TOKEN (Granular Access Token, read+write publish)
#
# @n8n/node-cli >= 0.23.0 required for provenance in CI.

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      # release-it / GitHub Releases may create either v0.1.1 or 0.1.1
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # OIDC for npm provenance + Trusted Publisher
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        # In GITHUB_ACTIONS, `npm run release` → lint + build + npm publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
